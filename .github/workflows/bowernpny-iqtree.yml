name: Bowern-PNY IQ-TREE pilot

on:
  workflow_dispatch:

jobs:
  phylogeny:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Bowern-PNY v4.1
        run: |
          git clone --depth 1 --branch v4.1 \
            https://github.com/lexibank/bowernpny.git data/bowernpny

      - name: Build binary cognate matrix
        run: |
          mkdir -p analysis
          python scripts/build_bowernpny_matrix.py \
            --dataset data/bowernpny \
            --output analysis/bowernpny_pilot.phy \
            --language-report analysis/language_selection.tsv \
            --matrix-report analysis/matrix_stats.txt

      - name: Install IQ-TREE 3.1.3
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: iqtree
          environment-file: environment.yml
          auto-activate-base: false

      - name: Verify IQ-TREE
        shell: bash -el {0}
        run: iqtree3 --version

      - name: Run ML tree + support tests
        shell: bash -el {0}
        run: |
          iqtree3 \
            -s analysis/bowernpny_pilot.phy \
            -st BIN \
            -m GTR2+ASC \
            -B 1000 \
            -alrt 1000 \
            -bnni \
            -T AUTO \
            --prefix analysis/bowernpny_pilot

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: bowernpny-iqtree-results
          path: analysis/
          if-no-files-found: error
